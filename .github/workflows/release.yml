name: Build & Release

# Push a tag like v1.0.2 to build both artifacts and attach them to a GitHub Release.
# Or run manually (workflow_dispatch) to build artifacts without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.3' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install build deps
        run: pip install pyinstaller
      - name: Build exe (PyInstaller)
        run: pyinstaller bedrock_updater.spec --noconfirm --clean
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist_installer/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.exe

  linux:
    # Older runner = older glibc, so the AppImage runs on Debian 12 and similar.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tkinter is available to bundle
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.3" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build deps
        run: pip install pyinstaller
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x packaging/linux/build-appimage.sh
          packaging/linux/build-appimage.sh "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: BedrockServerManager-*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BedrockServerManager-*.AppImage
